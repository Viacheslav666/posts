name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      contract: ${{ steps.filter.outputs.contract }}
      social_emulator: ${{ steps.filter.outputs.social_emulator }}
      qa_harness: ${{ steps.filter.outputs.qa_harness }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docs/api/openapi.yaml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'docs/api/openapi.yaml'
              - '.github/workflows/ci.yml'
            contract:
              - 'backend/apps/api/**'
              - 'frontend/packages/api-client/**'
              - 'docs/api/openapi.yaml'
              - '.github/workflows/ci.yml'
            social_emulator:
              - 'tests/social-emulator/**'
              - 'infra/docker-compose/docker-compose.yml'
              - '.github/workflows/ci.yml'
            qa_harness:
              - 'tests/e2e/**'
              - 'tests/contract/**'
              - 'tests/load/**'
              - 'docs/api/openapi.yaml'
              - 'frontend/apps/web/**'
              - 'backend/apps/api/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/nightly.yml'

  backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Docker API compatibility for Testcontainers
        run: echo 'api.version=1.44' > "$HOME/.docker-java.properties"
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: backend
      - name: Spotless, unit, integration
        working-directory: backend
        run: ./gradlew spotlessCheck build integrationTest

  migrations:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # squawk-action@v2 passes --fail-on-violations to the root CLI; squawk 2.x
      # only accepts that flag on upload-to-github. Run the CLI directly.
      - name: Install squawk
        run: npm install -g squawk-cli@2.73.0
      - name: Squawk lint Flyway migrations
        run: >
          squawk check
          --config backend/.squawk.toml
          --pg-version 16.0
          backend/libs/persistence/src/main/resources/db/migration/*.sql

  contract:
    needs: changes
    if: ${{ needs.changes.outputs.contract == 'true' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: backend
      - name: Regenerate OpenAPI
        working-directory: backend
        run: ./gradlew :apps:api:generateOpenApiDocs
      - name: Ensure OpenAPI committed
        run: git diff --exit-code docs/api/openapi.yaml
      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Regenerate TS client
        working-directory: frontend
        run: pnpm --filter @posts/api-client gen:api
      - name: Ensure api-client committed
        run: git diff --exit-code frontend/packages/api-client

  frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: frontend
        run: pnpm -r lint
      - name: Typecheck
        working-directory: frontend
        run: pnpm -r typecheck
      - name: Test
        working-directory: frontend
        run: pnpm -r test
      - name: Build
        working-directory: frontend
        run: pnpm --filter @posts/web build
      - name: Build Storybook
        working-directory: frontend
        run: pnpm --filter @posts/ui build-storybook
      - name: Upload Storybook
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: frontend/packages/ui/storybook-static
          if-no-files-found: error

  social-emulator:
    needs: changes
    if: ${{ needs.changes.outputs.social_emulator == 'true' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: tests/social-emulator
      - name: Spotless and unit tests
        working-directory: tests/social-emulator
        run: ./gradlew spotlessCheck test

  # QA-2: Playwright + Schemathesis smoke (API on openapi profile, no compose).
  # Full compose profile `full` runs in nightly.yml.
  e2e-smoke:
    needs: changes
    if: ${{ needs.changes.outputs.qa_harness == 'true' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_BASE_URL: http://127.0.0.1:8080
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: backend
      - name: Install Schemathesis
        run: pip install 'schemathesis>=3.39,<5'
      - name: Build API bootJar
        working-directory: backend
        run: ./gradlew :apps:api:bootJar
      - name: Start API (openapi profile)
        run: |
          set -euo pipefail
          JAR="$(ls backend/apps/api/build/libs/*.jar | head -n1)"
          nohup java -jar "$JAR" --spring.profiles.active=openapi --server.port=8080 \
            >/tmp/posts-api-openapi.log 2>&1 &
          echo $! > /tmp/posts-api-openapi.pid
          ok=0
          for i in $(seq 1 60); do
            if curl -sf "${API_BASE_URL}/api/v1/ping" >/dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            echo "API failed to start"; cat /tmp/posts-api-openapi.log; exit 1
          fi
      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Playwright smoke
        working-directory: tests/e2e
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm test:smoke
      - name: Schemathesis smoke
        run: |
          chmod +x tests/contract/run-smoke.sh
          ./tests/contract/run-smoke.sh
      - name: Upload smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-reports-${{ github.run_id }}
          path: |
            tests/e2e/playwright-report/
            tests/e2e/reports/
            tests/e2e/test-results/
            tests/contract/reports/
            /tmp/posts-api-openapi.log
          if-no-files-found: warn
      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/posts-api-openapi.pid ]; then
            kill "$(cat /tmp/posts-api-openapi.pid)" || true
          fi

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.21.2 detect --source . --verbose --no-git
