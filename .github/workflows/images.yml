name: Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: viacheslav666
  MEDIA_BASE_NAME: posts-java21-ffmpeg
  MEDIA_BASE_TAG: "21"

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, scheduler, publisher, media, ingest, notifications]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: backend

      - name: Image tags
        id: meta
        run: |
          TAGS="${{ github.sha }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="${TAGS},${{ github.ref_name }}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/posts-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Build media base (ffmpeg + JRE 21)
        if: matrix.service == 'media'
        run: |
          docker build \
            -t "${{ env.MEDIA_BASE_NAME }}:${{ env.MEDIA_BASE_TAG }}" \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.MEDIA_BASE_NAME }}:${{ env.MEDIA_BASE_TAG }}" \
            infra/docker/java21-ffmpeg

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push media base
        if: matrix.service == 'media' && github.event_name != 'pull_request'
        run: |
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.MEDIA_BASE_NAME }}:${{ env.MEDIA_BASE_TAG }}"

      - name: Build image (Jib → Docker daemon)
        working-directory: backend
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_NAME: ${{ steps.meta.outputs.image }}
          IMAGE_CREATED: ${{ steps.meta.outputs.created }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          EXTRA=""
          if [ "${{ matrix.service }}" = "media" ]; then
            EXTRA="-PpostsMediaBaseImage=docker://${{ env.MEDIA_BASE_NAME }}:${{ env.MEDIA_BASE_TAG }}"
          fi
          ./gradlew ":apps:${{ matrix.service }}:jibDockerBuild" $EXTRA

      - name: Push image to GHCR
        if: github.event_name != 'pull_request'
        run: |
          IMAGE="${{ steps.meta.outputs.image }}"
          IFS=',' read -ra TAGS <<< "${{ steps.meta.outputs.tags }}"
          for tag in "${TAGS[@]}"; do
            docker push "${IMAGE}:${tag}"
          done
          # Implied :latest from Jib when image ref has no tag
          docker push "${IMAGE}:latest" || true

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          format: cyclonedx-json
          artifact-name: sbom-posts-${{ matrix.service }}.cdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        if: github.event_name != 'pull_request'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign --yes \
            "${{ steps.meta.outputs.image }}:${{ github.sha }}"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image ref
        id: meta
        run: |
          echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/posts-web" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/posts-web
          tags: |
            type=raw,value=${{ github.sha }}
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=posts-web
            org.opencontainers.image.description=Posts SMM platform — web (Next.js)
            org.opencontainers.image.source=https://github.com/Viacheslav666/posts
            org.opencontainers.image.licenses=Proprietary
            org.opencontainers.image.vendor=Posts

      - name: Build (push on main/tags, load on PR)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/apps/web/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          format: cyclonedx-json
          artifact-name: sbom-posts-web.cdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        if: github.event_name != 'pull_request'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign --yes \
            "${{ steps.meta.outputs.image }}:${{ github.sha }}"
