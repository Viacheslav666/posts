name: Nightly

# QA-2: Schemathesis + e2e smoke + k6 smoke against docker-compose profile `full`.
# Reports are uploaded as artifacts.

on:
  schedule:
    # 02:00 UTC nightly
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  API_BASE_URL: http://127.0.0.1:8080
  PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
  PLAYWRIGHT_SKIP_WEBSERVER: "1"
  COMPOSE_FILE: infra/docker-compose/docker-compose.yml
  REGISTRY: ghcr.io/viacheslav666

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Docker API compatibility for Testcontainers / Jib
        run: echo 'api.version=1.44' > "$HOME/.docker-java.properties"

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: backend

      - name: Install Schemathesis
        run: pip install 'schemathesis>=3.39,<5'

      - name: Install k6
        run: |
          set -euo pipefail
          K6_VERSION=v1.3.0
          curl -fsSL "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz" \
            | sudo tar -xz --strip-components=1 -C /usr/local/bin
          k6 version

      - name: Build images for smoke stack (api + web + social-emulator + publisher-vk)
        run: |
          set -euo pipefail
          # api/emulator/publisher use distroless via Jib; compose expects ghcr.io/...:latest
          (cd backend && IMAGE_TAGS=latest ./gradlew :apps:api:jibDockerBuild :apps:publisher:jibDockerBuild)
          (cd tests/social-emulator && IMAGE_TAGS=latest ./gradlew jibDockerBuild)
          docker build -f frontend/apps/web/Dockerfile -t posts-web:local frontend

      - name: Start compose profile full (api + web + publisher-vk + deps)
        run: |
          set -euo pipefail
          docker compose -f "${COMPOSE_FILE}" --profile full up -d \
            postgres redis rabbitmq social-emulator api web publisher-vk

      - name: Wait for API and web
        run: |
          set -euo pipefail
          echo "==> waiting for API /api/v1/ping"
          ok=0
          for i in $(seq 1 90); do
            if curl -sf "${API_BASE_URL}/api/v1/ping" >/tmp/nightly-api-ping.json; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            echo "API ping failed"
            docker compose -f "${COMPOSE_FILE}" --profile full logs api --tail=120
            exit 1
          fi
          cat /tmp/nightly-api-ping.json; echo
          echo "==> waiting for web /health"
          ok=0
          for i in $(seq 1 60); do
            if curl -sf "${PLAYWRIGHT_BASE_URL}/health" >/dev/null; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            echo "web /health failed"
            docker compose -f "${COMPOSE_FILE}" --profile full logs web --tail=120
            exit 1
          fi
          echo "web /health OK"

      - name: Schemathesis (contract nightly)
        run: |
          chmod +x tests/contract/run-nightly.sh
          ./tests/contract/run-nightly.sh

      - name: E2E smoke + grabber P0 (Playwright)
        working-directory: tests/e2e
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm test:p0

      - name: E2E grabber full-stack (QA-12)
        working-directory: tests/e2e
        env:
          E2E_GRABBER_FULLSTACK: "1"
          EMULATOR_BASE_URL: http://127.0.0.1:8090
        run: pnpm test:grabber-fullstack

      - name: k6 smoke
        run: |
          mkdir -p tests/load/reports
          k6 run --out json=tests/load/reports/k6-smoke.json tests/load/smoke.js

      # QA-5: full TC-PUB suite including @Tag("nightly") load (TC-PUB-01 / 10k).
      # QA-10: OrdAdPipelineIT (TC-AD-06/07/12 fail-closed / ads regress) included in publisher IT.
      - name: Publisher pipeline IT (include nightly load)
        working-directory: backend
        run: |
          echo 'api.version=1.44' > "$HOME/.docker-java.properties"
          ./gradlew :apps:publisher:integrationTest -PincludeNightly=true

      # QA-10: API ORD / WireMock TC-AD P0 (fail-closed, idempotency, RBAC, recurrence).
      # QA-13: parity E2E ad+media→erid→placement→act/stats (WireMock; never live api.ord.vk.com).
      # UI TC-AD-01…04 runs in PR CI e2e-smoke (MSW); compose `full` web is without mocks.
      - name: API ORD ad-marking IT (TC-AD) + QA-13 parity E2E
        working-directory: backend
        run: |
          echo 'api.version=1.44' > "$HOME/.docker-java.properties"
          ./gradlew :apps:api:integrationTest --tests 'ru.posts.api.ord.*' --tests 'ru.posts.api.qa13.*'

      # QA-12 / QA-13: grabber IT including @Tag("nightly") + filters/similarity.
      - name: Grabber ingest IT (include nightly)
        working-directory: backend
        run: |
          echo 'api.version=1.44' > "$HOME/.docker-java.properties"
          ./gradlew :apps:api:integrationTest -PincludeNightly=true --tests 'ru.posts.api.ingest.*'

      # QA-13: VK/OK official-docs contract fixtures + prod profile guard (unit).
      - name: Social adapter contract + ORD sandbox guard (unit)
        working-directory: backend
        run: |
          ./gradlew :libs:social-vk:test --tests 'ru.posts.social.vk.VkSocialAdapterQa13ContractTest' \
            :libs:social-ok:test --tests 'ru.posts.social.ok.OkSocialAdapterQa13ContractTest' \
            :libs:ord-api:test --tests 'ru.posts.ord.api.OrdSandboxGuardTest' \
            :apps:publisher:test --tests 'ru.posts.publisher.config.ProdProfileNoControlPathTest'

      # QA-13: P0 AC parity coverage report must stay at 100%.
      - name: P0 parity AC coverage = 100%
        run: python3 docs/qa/generate_p0_parity_coverage_report.py

      # QA-11: stories API + VK/OK pipeline IT (0 duplicates / waiting_for_channel / ads fail-closed).
      - name: E2E scheduled stories (QA-11 / MSW)
        working-directory: tests/e2e
        run: pnpm test:stories
      - name: API stories IT (TC-STORY)
        working-directory: backend
        run: |
          echo 'api.version=1.44' > "$HOME/.docker-java.properties"
          ./gradlew :apps:api:integrationTest --tests 'ru.posts.api.post.Stories*' --tests 'ru.posts.api.channel.NetworkCapabilitiesStoriesIT'
      - name: Publisher story pipeline IT (VK/OK)
        working-directory: backend
        run: |
          echo 'api.version=1.44' > "$HOME/.docker-java.properties"
          ./gradlew :apps:publisher:integrationTest --tests 'ru.posts.publisher.pipeline.Story*'

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-reports-${{ github.run_id }}
          path: |
            tests/contract/reports/
            tests/e2e/playwright-report/
            tests/e2e/reports/
            tests/e2e/test-results/
            tests/load/reports/
            backend/apps/publisher/build/reports/tests/integrationTest/
            backend/apps/api/build/reports/tests/integrationTest/
          if-no-files-found: warn

      - name: Compose logs on failure
        if: failure()
        run: |
          docker compose -f "${COMPOSE_FILE}" --profile full ps
          docker compose -f "${COMPOSE_FILE}" --profile full logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose -f "${COMPOSE_FILE}" --profile full --profile emulator down -v || true
