name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [java, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - if: matrix.language == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - if: matrix.language == 'java'
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: backend
          cache-read-only: true
      # Clean + no build-cache so CodeQL tracer always sees javac (empty DB otherwise
      # when Gradle restores compile outputs from cache on PRs that barely touch Java).
      - if: matrix.language == 'java'
        name: Build backend (CodeQL trace)
        working-directory: backend
        run: ./gradlew --no-build-cache clean build -x test -x integrationTest
      - if: matrix.language == 'java'
        name: Build social-emulator (CodeQL trace)
        working-directory: tests/social-emulator
        run: ./gradlew --no-build-cache clean compileJava
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
