name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - if: matrix.language == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          # Dependency cache only (jars). Do NOT enable Gradle build cache /
          # setup-gradle restore for this job: CodeQL traces javac, and
          # UP-TO-DATE compiles leave an empty DB ("no source code seen").
          cache: gradle
          cache-dependency-path: |
            backend/**/*.gradle*
            backend/gradle/libs.versions.toml
            tests/social-emulator/**/*.gradle*
      - if: matrix.language == 'java'
        name: Build backend for CodeQL tracing
        working-directory: backend
        run: |
          set -euo pipefail
          # Stagger past the Images/CI resolve storm on the same push (Maven Central 429).
          sleep $((30 + RANDOM % 30))
          for attempt in 1 2 3 4 5 6 7 8; do
            if ./gradlew compileJava --no-daemon --no-build-cache --rerun-tasks; then
              exit 0
            fi
            if [ "$attempt" -eq 8 ]; then
              exit 1
            fi
            backoff=$((attempt * 45))
            echo "Gradle resolve/build failed (often Maven Central 429); retry $attempt/8 after ${backoff}s"
            sleep "$backoff"
          done
      - if: matrix.language == 'java'
        name: Build social-emulator for CodeQL tracing
        working-directory: tests/social-emulator
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            if ./gradlew compileJava --no-daemon --no-build-cache --rerun-tasks; then
              exit 0
            fi
            if [ "$attempt" -eq 8 ]; then
              exit 1
            fi
            backoff=$((attempt * 45))
            echo "Gradle resolve/build failed (often Maven Central 429); retry $attempt/8 after ${backoff}s"
            sleep "$backoff"
          done
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
