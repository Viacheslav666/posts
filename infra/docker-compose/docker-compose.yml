name: posts-local

# Shared snippets for profile `full` (DEV-4). Distroless JVM images have no shell/curl.
x-jvm-distroless-health: &jvm-distroless-health
  healthcheck:
    test: ["CMD", "/usr/bin/java", "-version"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 40s

# Production social / OAuth / billing hosts must not be used in profile `full` — point at social-emulator.
x-full-external-emulator-deps: &full-external-emulator-deps
  POSTS_SOCIAL_EMULATOR_URL: http://social-emulator:8090
  POSTS_SOCIAL_BASE_URL: http://social-emulator:8090
  POSTS_VK_API_BASE_URL: http://social-emulator:8090
  POSTS_SOCIAL_VK_BASE_URL: http://social-emulator:8090
  POSTS_SOCIAL_OK_BASE_URL: http://social-emulator:8090
  POSTS_SOCIAL_MAX_BASE_URL: http://social-emulator:8090
  POSTS_SOCIAL_TELEGRAM_BASE_URL: http://social-emulator:8090
  POSTS_TG_NOTIFY_API_BASE_URL: http://social-emulator:8090
  POSTS_VK_ID_BASE_URL: http://social-emulator:8090
  POSTS_YANDEX_OAUTH_BASE_URL: http://social-emulator:8090/yandex
  POSTS_YANDEX_OAUTH_USER_INFO_URL: http://social-emulator:8090/yandex/info
  POSTS_YOOKASSA_BASE_URL: http://social-emulator:8090/yookassa/v3
  POSTS_ORD_VK_BASE_URL: http://social-emulator:8090/ord

x-spring-local-deps: &spring-local-deps
  POSTS_DB_HOST: postgres
  POSTS_DB_PORT: "5432"
  POSTS_DB_NAME: posts
  POSTS_DB_USER: posts
  POSTS_DB_PASSWORD: posts
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/posts
  SPRING_DATASOURCE_USERNAME: posts
  SPRING_DATASOURCE_PASSWORD: posts
  POSTS_REDIS_HOST: redis
  POSTS_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  POSTS_RABBIT_HOST: rabbitmq
  POSTS_RABBIT_USER: posts
  POSTS_RABBIT_PASSWORD: posts
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_USERNAME: posts
  SPRING_RABBITMQ_PASSWORD: posts
  SPRING_RABBITMQ_PORT: "5672"
  POSTS_RATELIMIT_ENABLED: "false"
  POSTS_CRYPTO_KEK: local-dev-posts-kek
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
  POSTS_APP_BASE_URL: ${POSTS_APP_BASE_URL:-http://localhost:3000}
  POSTS_S3_ENDPOINT: http://minio:9090
  POSTS_S3_PRESIGN_PUBLIC_BASE_URL: ${POSTS_APP_BASE_URL:-http://localhost:3000}/s3
  POSTS_SOCIAL_PUBLIC_BASE_URL: ${POSTS_APP_BASE_URL:-http://localhost:3000}/emulator
  POSTS_YOOKASSA_RETURN_URL: ${POSTS_APP_BASE_URL:-http://localhost:3000}/billing/return
  <<: *full-external-emulator-deps

# Publisher env without POSTS_PUBLISHER_NETWORK (set per service).
x-publisher-env: &publisher-env
  <<: *spring-local-deps
  SERVER_PORT: "8080"
  SPRING_APPLICATION_NAME: posts-publisher
  POSTS_RATELIMIT_ENABLED: "true"
  POSTS_RATELIMIT_REDIS_URI: redis://redis:6379

x-jvm-full-service: &jvm-full-service
  <<: *jvm-distroless-health
  extra_hosts:
    - "api.vk.com:127.0.0.1"
    - "id.vk.ru:127.0.0.1"
    - "api.telegram.org:127.0.0.1"
    - "platform-api.max.ru:127.0.0.1"
    - "platform-api2.max.ru:127.0.0.1"
    - "api.ok.ru:127.0.0.1"
    - "api.ord.vk.com:127.0.0.1"
    - "api.yookassa.ru:127.0.0.1"
    - "oauth.yandex.ru:127.0.0.1"
    - "login.yandex.ru:127.0.0.1"

x-publisher-base: &publisher-base
  <<: *jvm-full-service
  image: ghcr.io/viacheslav666/posts-publisher:latest
  profiles: ["full"]
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    social-emulator:
      condition: service_started

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: posts
      POSTGRES_USER: posts
      POSTGRES_PASSWORD: posts
    ports:
      - "5432:5432"
    volumes:
      - posts_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posts -d posts"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - posts_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: posts
      RABBITMQ_DEFAULT_PASS: posts
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - posts_rabbit:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # MinIO official images are currently unavailable from public registries in some
  # environments; adobe/s3mock provides S3-compatible local storage for DEV-1.
  # (See docs/adr/0008-dev1-skeleton-decisions.md.)
  minio:
    image: adobe/s3mock:latest
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: posts-media
    ports:
      - "9000:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: posts
      CLICKHOUSE_USER: posts
      CLICKHOUSE_PASSWORD: posts
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9009:9000"
    volumes:
      - posts_ch:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://posts:posts@127.0.0.1:8123/ping' | grep -q Ok"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8025/api/v1/info >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  otel-lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3001:3000"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - posts_lgtm:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  # QA-3: build locally first — `cd tests/social-emulator && ./gradlew jibDockerBuild`
  # Distroless image (DEV-3 conventions): no shell/wget; probe from host via /_control/health.
  social-emulator:
    image: ghcr.io/viacheslav666/posts-social-emulator:latest
    profiles: ["emulator", "full"]
    ports:
      - "8090:8090"
    environment:
      SERVER_PORT: "8090"
      POSTS_APP_BASE_URL: ${POSTS_APP_BASE_URL:-http://localhost:3000}
    healthcheck:
      test: ["CMD", "/usr/bin/java", "-version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  # -------------------------------------------------------------------------
  # DEV-4 profile `full`: locally built app images + web + emulator.
  # Build: `make images` (or `make up-full`). Host probes: API :8080, web :3000.
  # -------------------------------------------------------------------------

  api:
    <<: *jvm-full-service
    image: ghcr.io/viacheslav666/posts-api:latest
    profiles: ["full"]
    ports:
      - "8080:8080"
    environment:
      <<: *spring-local-deps
      SERVER_PORT: "8080"
      SPRING_APPLICATION_NAME: posts-api
      # Override localhost from application-local.yml for in-network hosts.
      SPRING_PROFILES_ACTIVE: local
      POSTS_APP_BASE_URL: ${POSTS_APP_BASE_URL:-http://localhost:3000}
      MAILPIT_SMTP_HOST: mailpit
      MAILPIT_SMTP_PORT: "1025"
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      social-emulator:
        condition: service_started

  scheduler:
    <<: *jvm-full-service
    image: ghcr.io/viacheslav666/posts-scheduler:latest
    profiles: ["full"]
    ports:
      - "8081:8080"
    environment:
      <<: *spring-local-deps
      SERVER_PORT: "8080"
      SPRING_APPLICATION_NAME: posts-scheduler
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      social-emulator:
        condition: service_started

  # One image posts-publisher, one container per network (BE-4 will consume these env vars).
  publisher-vk:
    <<: *publisher-base
    container_name: posts-publisher-vk
    ports:
      - "8082:8080"
    environment:
      <<: *publisher-env
      POSTS_PUBLISHER_NETWORK: vk

  publisher-tg:
    <<: *publisher-base
    container_name: posts-publisher-tg
    ports:
      - "8083:8080"
    environment:
      <<: *publisher-env
      POSTS_PUBLISHER_NETWORK: tg

  publisher-ok:
    <<: *publisher-base
    container_name: posts-publisher-ok
    ports:
      - "8084:8080"
    environment:
      <<: *publisher-env
      POSTS_PUBLISHER_NETWORK: ok

  publisher-max:
    <<: *publisher-base
    container_name: posts-publisher-max
    ports:
      - "8085:8080"
    environment:
      <<: *publisher-env
      POSTS_PUBLISHER_NETWORK: max

  media:
    # Base is Temurin+ffmpeg (not distroless); java is on PATH.
    image: ghcr.io/viacheslav666/posts-media:latest
    profiles: ["full"]
    ports:
      - "8086:8080"
    environment:
      <<: *spring-local-deps
      SERVER_PORT: "8080"
      SPRING_APPLICATION_NAME: posts-media
      POSTS_S3_ENDPOINT: http://minio:9090
      POSTS_S3_ACCESS_KEY: posts
      POSTS_S3_SECRET_KEY: postsposts
      POSTS_S3_BUCKET: posts-media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "java", "-version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  ingest:
    <<: *jvm-full-service
    image: ghcr.io/viacheslav666/posts-ingest:latest
    profiles: ["full"]
    ports:
      - "8087:8080"
    environment:
      <<: *spring-local-deps
      SERVER_PORT: "8080"
      SPRING_APPLICATION_NAME: posts-ingest
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      social-emulator:
        condition: service_started

  notifications:
    <<: *jvm-full-service
    image: ghcr.io/viacheslav666/posts-notifications:latest
    profiles: ["full"]
    ports:
      - "8088:8080"
    environment:
      <<: *spring-local-deps
      SERVER_PORT: "8080"
      SPRING_APPLICATION_NAME: posts-notifications
      POSTS_SMTP_HOST: mailpit
      POSTS_SMTP_PORT: "1025"
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      POSTS_TG_NOTIFY_BOT_TOKEN: ${POSTS_TG_NOTIFY_BOT_TOKEN:-emulator-token}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  web:
    image: posts-web:local
    profiles: ["full"]
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      # Same-origin via gateway on :3000 (no MSW in full stack).
      NEXT_PUBLIC_API_MOCKING: "false"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Same-origin entrypoint: / → web, /api/* and /ws → api (browser only talks to :3000).
  # CI guard (not started by `up --profile full`; run via profile `compose-guard` after wait-full).
  compose-full-egress-guard:
    image: alpine:3.20
    profiles: ["compose-guard"]
    extra_hosts:
      - "api.vk.com:127.0.0.1"
      - "id.vk.ru:127.0.0.1"
      - "api.telegram.org:127.0.0.1"
      - "platform-api.max.ru:127.0.0.1"
      - "api.ok.ru:127.0.0.1"
      - "api.ord.vk.com:127.0.0.1"
      - "api.yookassa.ru:127.0.0.1"
      - "oauth.yandex.ru:127.0.0.1"
    depends_on:
      social-emulator:
        condition: service_started
    restart: "no"
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        wget -q -O- http://social-emulator:8090/_control/health
        if wget -q --timeout=3 -O /dev/null https://api.vk.com 2>/dev/null; then
          echo "egress guard: unexpected reachability of api.vk.com" >&2
          exit 1
        fi
        echo "egress guard ok"

  gateway:
    image: nginx:1.27-alpine
    profiles: ["full"]
    ports:
      - "3000:3000"
    volumes:
      - ./nginx/full-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s

volumes:
  posts_pg:
  posts_redis:
  posts_rabbit:
  posts_ch:
  posts_lgtm:
