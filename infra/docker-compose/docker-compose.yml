name: posts-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: posts
      POSTGRES_USER: posts
      POSTGRES_PASSWORD: posts
    ports:
      - "5432:5432"
    volumes:
      - posts_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posts -d posts"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - posts_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: posts
      RABBITMQ_DEFAULT_PASS: posts
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - posts_rabbit:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # MinIO official images are currently unavailable from public registries in some
  # environments; adobe/s3mock provides S3-compatible local storage for DEV-1.
  # (See docs/adr/0001-dev1-skeleton-decisions.md.)
  minio:
    image: adobe/s3mock:latest
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: posts-media
    ports:
      - "9000:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: posts
      CLICKHOUSE_USER: posts
      CLICKHOUSE_PASSWORD: posts
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9009:9000"
    volumes:
      - posts_ch:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://posts:posts@localhost:8123/ping' | grep -q Ok"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8025/api/v1/info >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  otel-lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3001:3000"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - posts_lgtm:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  # QA-3: build locally first — `cd tests/social-emulator && ./gradlew jibDockerBuild`
  social-emulator:
    image: ghcr.io/viacheslav666/posts-social-emulator:latest
    profiles: ["emulator", "full"]
    ports:
      - "8090:8090"
    environment:
      SERVER_PORT: "8090"
    healthcheck:
      # Temurin image has bash; TCP open ≈ process accepts connections (HTTP probe from host).
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8090'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

volumes:
  posts_pg:
  posts_redis:
  posts_rabbit:
  posts_ch:
  posts_lgtm:
