# DEV-4 profile `full`: browser hits :3000; nginx fans out to Next.js (web) and Spring API (api).
server {
    listen 3000;
    server_name _;
    client_max_body_size 100m;

    location /s3/ {
        # Browser multipart uploads read each part ETag. Safari hides ETag on
        # cross-origin responses unless it is listed in Access-Control-Expose-Headers.
        # Prod (socialposts.ru /s3/ in front of s3mock or MinIO) needs the same headers.
        # Part size is 5 MiB, so client_max_body_size must stay above that.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, PUT, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, x-amz-date, x-amz-content-sha256, x-amz-security-token" always;
            add_header Access-Control-Expose-Headers "ETag, x-amz-request-id, x-amz-id-2" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            return 204;
        }

        proxy_pass http://minio:9090/;
        proxy_http_version 1.1;
        # Presigned URLs are signed against the internal MinIO endpoint host.
        proxy_set_header Host minio:9090;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_pass_header ETag;
        client_max_body_size 100m;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "ETag, x-amz-request-id, x-amz-id-2" always;
    }

    location /emulator/ {
        proxy_pass http://social-emulator:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}