        perTokenRps:
          type: number
          format: double
    Recurrence:
      type: object
      description: "Recurrence rule. Optional times[] (HH:mm in post timezone) expands\
        \ multiple runs per day; when omitted, the time-of-day from scheduledAt is\
        \ used (backward compatible)."
      properties:
        byWeekday:
          type: array
          items:
            type: string
        freq:
          type: string
          description: Recurrence frequency for scheduled posts
          enum:
          - once
          - daily
          - weekdays
          - weekends
          - weekly
          - monthly
          - every_n_days
          - every_n_weeks
          - every_n_months
        interval:
          type: integer
          format: int32
          example: 1
        times:
          type: array
          description: "Clock times in post timezone, format HH:mm (e.g. 09:00, 18:30)"
          example:
          - 09:00
          - 18:30
          items:
            type: string
            pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
        until:
          type: string
          format: date-time
      required:
      - freq
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: Opaque refresh token when not using httpOnly cookie
