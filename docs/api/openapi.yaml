components:
  schemas:
    AcceptInvitationRequest:
      type: object
      properties:
        token:
          type: string
      required:
      - token
    AdMarking:
      type: object
      description: Full advertiser / ORD marking block (feature spec §3.4). Stored
        as posts.ad_payload jsonb.
      properties:
        address:
          type: string
        advertiserName:
          type: string
          description: Advertiser name / FIO
        amount:
          type: number
          minimum: 0
        autoDeleteAfterPeriod:
          type: boolean
        contractAmount:
          type: number
          minimum: 0
        contractDate:
          type: string
          format: date
        contractDateEnd:
          type: string
          format: date
        contractSerial:
          type: string
        contractorId:
          type: string
          format: uuid
        description:
          type: string
          maxLength: 1000
          minLength: 0
        displayPeriodDays:
          type: integer
          format: int32
          maximum: 365
          minimum: 1
        erid:
          type: string
          description: Erid after registration; read-only on responses
        foreignEpayment:
          type: string
        foreignInn:
          type: string
        foreignRegNumber:
          type: string
        inn:
          type: string
          description: INN — 10 or 12 digits
        isForeign:
          type: boolean
        kktuCodes:
          type: array
          items:
            type: string
          maxItems: 2147483647
          minItems: 1
        kpp:
          type: string
          description: KPP; required for juridical
        markingType:
          type: string
          description: Marking mode / type_marking
          example: 0
        oksmCountry:
          type: string
          description: OKSM country code
          example: 643
        orgType:
          type: string
          description: physical | ip | juridical | foreign_physical | foreign_juridical
          enum:
          - physical
          - ip
          - juridical
          - foreign_physical
          - foreign_juridical
        phone:
          type: string
        roles:
          type: array
          items:
            type: string
        selfPromo:
          type: boolean
        vatRate:
          type: string
          description: VAT rate
          example: without_vat
    AdMarkingSummary:
      type: object
      description: Lightweight ad marking card fields for list/calendar (full ORD
        in BE-15).
      properties:
        advertiserName:
          type: string
        enabled:
          type: boolean
        erid:
          type: string
    ApplyPromoRequest:
      type: object
      properties:
        code:
          type: string
        workspaceId:
          type: string
          format: uuid
      required:
      - code
      - workspaceId
    ApplyPromoResponse:
      type: object
      properties:
        code:
          type: string
        kind:
          type: string
          example: percent
        validUntil:
          type: string
          format: date-time
        value:
          type: number
    AuditLogEntry:
      type: object
      description: Workspace audit log row (US-2.4); retention 1 year
      properties:
        action:
          type: string
          example: member.role_changed
        actorId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        diff:
          type: object
          additionalProperties:
            type: object
          description: JSON diff of changed fields
        entity:
          type: string
          example: workspace_member
        entityId:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        ip:
          type: string
          example: 203.0.113.10
        workspaceId:
          type: string
          format: uuid
    AuditLogPage:
      type: object
      properties:
        hasMore:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogEntry"
        nextCursor:
          type: string
    BatchStoriesRequest:
      type: object
      properties:
        ad:
          type: boolean
        adMarking:
          $ref: "#/components/schemas/AdMarking"
        channelIds:
          type: array
          items:
            type: string
            format: uuid
        mediaIds:
          type: array
          items:
            type: string
            format: uuid
        projectId:
          type: string
          format: uuid
        scheduledAt:
          type: string
          format: date-time
        stepMinutes:
          type: integer
          format: int32
          description: Minutes between consecutive stories
          example: 5
          minimum: 0
        story:
          $ref: "#/components/schemas/StoryOptions"
        timezone:
          type: string
          example: Europe/Moscow
        workspaceId:
          type: string
          format: uuid
      required:
      - channelIds
      - mediaIds
      - scheduledAt
      - workspaceId
    BatchStoriesResponse:
      type: object
      properties:
        created:
          type: integer
          format: int32
        failures:
          type: array
          items:
            $ref: "#/components/schemas/BatchStoryFailure"
        postIds:
          type: array
          items:
            type: string
            format: uuid
    BatchStoryFailure:
      type: object
      properties:
        code:
          type: string
        mediaId:
          type: string
          format: uuid
        message:
          type: string
    BulkPostsRequest:
      type: object
      properties:
        action:
          type: string
          description: duplicate accepted per FE-8 contract proposal
          enum:
          - pause
          - resume
          - delete
          - reschedule
          - duplicate
        postIds:
          type: array
          items:
            type: string
            format: uuid
        scheduledAt:
          type: string
          format: date-time
      required:
      - action
      - postIds
    BulkPostsResponse:
      type: object
      properties:
        affected:
          type: integer
          format: int32
        failedIds:
          type: array
          items:
            type: string
            format: uuid
    CalendarItem:
      type: object
      description: Lightweight calendar cell DTO
      properties:
        ad:
          type: boolean
        adMarking:
          $ref: "#/components/schemas/AdMarkingSummary"
        authorId:
          type: string
          format: uuid
        channelIds:
          type: array
          items:
            type: string
            format: uuid
        contentKind:
          type: string
          enum:
          - post
          - story
        id:
          type: string
          format: uuid
        networks:
          type: array
          items:
            type: string
            description: Social network identifier (DB / publish routing key)
            enum:
            - vk
            - tg
            - ok
            - max
            - rutube
        projectId:
          type: string
          format: uuid
        scheduledAt:
          type: string
          format: date-time
        status:
          type: string
          description: Aggregate post status. `deleted_from_network` = removed from
            social networks via auto-delete/manual delete; soft-deleted drafts use
            `archived`.
          enum:
          - draft
          - pending_approval
          - approved
          - scheduled
          - publishing
          - published
