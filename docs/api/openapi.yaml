components:
  schemas:
    AcceptInvitationRequest:
      type: object
      properties:
        token:
          type: string
      required:
      - token
    AdMarking:
      type: object
      description: "Full advertiser / ORD marking block (feature spec §3.4, BE-25).\
        \ Stored as posts.ad_payload jsonb."
      properties:
        address:
          type: string
        advertiserName:
          type: string
          description: Advertiser name / FIO
        amount:
          type: number
          minimum: 0
        amountVat:
          $ref: "#/components/schemas/VatBreakdown"
          description: Server-computed VAT split for amount (response/preview)
        autoDeleteAfterPeriod:
          type: boolean
        contractAmount:
          type: number
          minimum: 0
        contractAmountVat:
          $ref: "#/components/schemas/VatBreakdown"
          description: Server-computed VAT split for contractAmount
        contractDate:
          type: string
          format: date
        contractDateEnd:
          type: string
          format: date
        contractSerial:
          type: string
        contractorId:
          type: string
          format: uuid
        customerRole:
          type: string
          description: Customer role
          enum:
          - advertiser
          - agency
          - publisher
          - ors
          example: advertiser
        description:
          type: string
          maxLength: 1000
          minLength: 0
        displayPeriodDays:
          type: integer
          format: int32
          maximum: 365
          minimum: 1
        erid:
          type: string
          description: Erid after registration; read-only on responses
        executor:
          type: string
          description: "Executor: self (default) or contractor UUID"
        foreignEpayment:
          type: string
        foreignInn:
          type: string
        foreignRegNumber:
          type: string
        inn:
          type: string
          description: INN — 10 or 12 digits with checksum; foreign ids when isForeign
        isForeign:
          type: boolean
        kktuCodes:
          type: array
          items:
            type: string
          maxItems: 2147483647
          minItems: 1
        kpp:
          type: string
          description: KPP; required for juridical
        markingType:
          type: string
          deprecated: true
          description: Legacy vposter type_marking 0..5; mapped to placement when
            placement omitted
          example: 0
        oksmCountry:
          type: string
          description: OKSM country code
          example: 643
        orgType:
          type: string
          description: physical | ip | juridical | foreign_physical | foreign_juridical
          enum:
          - physical
          - ip
          - juridical
          - foreign_physical
          - foreign_juridical
        phone:
          type: string
        placement:
          type: string
          description: Preferred placement mode (BE-25)
          enum:
          - vk_menu
          - text_start
          - text_end
          - vk_menu_and_text_end
          - click_link_start
          - click_link_end
        provider:
          type: string
          description: ORD provider override; null = workspace default connection
          enum:
          - vk_ord
          - yandex_ord
        roles:
          type: array
          items:
            type: string
        selfPromo:
          type: boolean
        socialAd:
          type: boolean
          description: Social advertising flag
        socialAdQuota:
          type: boolean
          description: Social advertising under quota
        vatRate:
          type: string
          description: VAT rate
          enum:
          - without_vat
          - "0"
          - "5"
          - "7"
          - "10"
          - "20"
          - "22"
          example: without_vat
        warnings:
          type: array
          description: Warnings such as vk_menu_unsupported fallback; filled on preview/register
            responses
          items:
            type: string
    AdMarkingSummary:
      type: object
      description: Lightweight ad marking card fields for list/calendar (full ORD
        in BE-15).
      properties:
        advertiserName:
          type: string
        enabled:
          type: boolean
        erid:
          type: string
    AdRevenue:
      type: object
      description: ORD invoice totals for the month (amounts include VAT when taxed)
      properties:
        amountWithVat:
          type: number
          example: 120.0
        amountWithoutVat:
          type: number
          example: 100.0
        fee3Pct:
          type: number
          description: "3% advertising levy on amountWithVat (HALF_UP, scale 2)"
          example: 3.6
        vatAmount:
          type: number
          example: 20.0
      required:
      - amountWithVat
      - amountWithoutVat
      - fee3Pct
      - vatAmount
    AdminAdjustBalanceRequest:
      type: object
      properties:
        amount:
          type: number
        kind:
          type: string
          example: admin_credit
        reason:
          type: string
          maxLength: 500
          minLength: 3
      required:
      - amount
      - reason
    AdminAdjustSubscriptionRequest:
      type: object
      properties:
        billingStatus:
          type: string
          description: Workspace billing status
          enum:
          - trial
          - active
          - grace
          - frozen
        periodEnd:
          type: string
          format: date-time
        planCode:
          type: string
        reason:
          type: string
          maxLength: 500
