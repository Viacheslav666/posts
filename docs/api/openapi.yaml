  name: Channel sets
- description: Connected social channels and connect flows
  name: Channels
- description: "Grabber / RSS / website automation rules, runs, moderation queue (BE-17/BE-17b/BE-27)"
  name: Ingest
- description: Inbound webhooks for VK / Telegram / Max (validate + enqueue)
  name: Social hooks
- description: In-app notifications and delivery settings (US-5.4)
  name: Notifications
- description: "Wallet, plans, top-up, autopay, invoices, promo codes"
  name: Billing
- description: Inbound social event subscription status / repair (BE-32)
  name: Event subscriptions
- description: Media library uploads via presigned S3 URLs
  name: Media
- description: Platform admin API (E7 / A13). Requires users.platform_admin — not
    a workspace role.
  name: Admin
- description: Batch scheduled stories (BE-16 / E11)
  name: Stories
- description: "Posts, variants, schedule actions, preview, bulk"
  name: Posts
- description: YooKassa payment notifications
  name: Billing webhooks
- description: Projects (clients/brands) inside a workspace
  name: Projects
- description: Workspace invitations by email (US-2.3)
  name: Invitations
- description: Workspaces and members
  name: Workspaces
- description: Per-channel publication attempts and live status
  name: Publications
- description: Network capability matrix for validation and UI
  name: Networks
- description: Public signing keys for access JWT verification
  name: JWKS
- description: "Ad marking / ORD connections, contractors, creatives"
  name: ORD
- description: Current user profile and sessions
  name: Me
- description: Workspace publication analytics (materialised monthly aggregates)
  name: Analytics
- description: "Registration, login, OAuth, 2FA, password recovery"
  name: Auth
