    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJFUzI1NiJ9...
        expiresIn:
          type: integer
          format: int64
          description: Access token TTL in seconds
          example: 900
        refreshToken:
          type: string
          description: Present for non-cookie clients
        tokenType:
          type: string
          example: Bearer
    TwoFactorConfirmRequest:
      type: object
      properties:
        code:
          type: string
          example: 123456
          maxLength: 8
          minLength: 6
      required:
      - code
    TwoFactorDisableRequest:
      type: object
      properties:
        password:
          type: string
        totpCode:
          type: string
          maxLength: 8
          minLength: 6
      required:
      - password
      - totpCode
    TwoFactorSetupResponse:
      type: object
      properties:
        backupCodes:
          type: array
          description: One-time backup codes (shown once)
          items:
            type: string
        otpauthUrl:
          type: string
          description: otpauth:// URI for authenticator apps
        secret:
          type: string
          description: Base32 secret for manual entry
    UpdateChannelRequest:
      type: object
      properties:
        projectId:
          type: string
          format: uuid
        timezone:
          type: string
          example: Europe/Moscow
    UpdateChannelSetRequest:
      type: object
      properties:
        channelIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 50
          minItems: 0
        name:
          type: string
          maxLength: 120
          minLength: 1
    UpdateMeRequest:
      type: object
      properties:
        avatarUrl:
          type: string
        locale:
          type: string
          example: ru
        name:
          type: string
          maxLength: 120
          minLength: 1
        timezone:
          type: string
          example: Europe/Moscow
    UpdateMemberRequest:
      type: object
      properties:
        projectIds:
          type: array
          description: Assigned project IDs
          items:
            type: string
            format: uuid
        role:
          type: string
          description: Workspace member role
          enum:
          - owner
          - admin
          - editor
          - author
          - viewer
      required:
      - role
    UpdateNotificationSettingsRequest:
      type: object
      properties:
        emailEnabled:
          type: boolean
        inAppEnabled:
          type: boolean
        mutedTypes:
          type: array
          items:
            type: string
        telegramBotEnabled:
          type: boolean
        webPushEnabled:
          type: boolean
    UpdatePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          maxLength: 128
          minLength: 10
      required:
      - currentPassword
      - newPassword
    UpdatePostRequest:
      type: object
      properties:
        ad:
          type: boolean
        baseContent:
          $ref: "#/components/schemas/PostContent"
        projectId:
          type: string
          format: uuid
        recurrence:
          $ref: "#/components/schemas/Recurrence"
        repost:
          $ref: "#/components/schemas/RepostTarget"
        scheduledAt:
          type: string
          format: date-time
        title:
          type: string
          maxLength: 200
          minLength: 0
        variants:
          type: array
          items:
            $ref: "#/components/schemas/PostVariantUpsert"
        version:
          type: integer
          format: int32
          description: Optimistic lock version
      required:
      - version
    UpdateProjectRequest:
      type: object
      properties:
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        name:
          type: string
          maxLength: 120
          minLength: 1
    UpdateWorkspaceRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 1
      required:
      - name
    UserProfile:
      type: object
      description: Current authenticated user (`GET /me`)
      properties:
        avatarUrl:
          type: string
        createdAt:
          type: string
          format: date-time
        email:
          type: string
          example: local@posts.test
        emailVerified:
          type: boolean
        id:
          type: string
          format: uuid
        locale:
          type: string
          example: ru
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/MembershipSummary"
        name:
          type: string
          example: Local Dev
        timezone:
          type: string
          example: Europe/Moscow
        totpEnabled:
          type: boolean
    ValidationIssue:
      type: object
      properties:
        code:
          type: string
          example: text.max_chars
        field:
          type: string
        message:
          type: string
        severity:
          type: string
          example: error
    Workspace:
      type: object
      properties:
        billingStatus:
          type: string
          description: Workspace billing status
          enum:
          - trial
          - active
          - grace
          - frozen
        createdAt:
          type: string
          format: date-time
        currentPeriodEnd:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Агентство Ромашка
        ownerUserId:
          type: string
          format: uuid
        planCode:
          type: string
        trialEndsAt:
          type: string
          format: date-time
    WorkspaceMember:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        email:
          type: string
          example: editor@example.com
        name:
          type: string
          example: Мария
        projectIds:
          type: array
          items:
            type: string
            format: uuid
        role:
          type: string
          description: Workspace member role
          enum:
          - owner
          - admin
          - editor
          - author
          - viewer
        userId:
          type: string
          format: uuid
    WorkspaceMemberPage:
      type: object
      properties:
        hasMore:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceMember"
        nextCursor:
          type: string
    WorkspacePage:
      type: object
      properties:
        hasMore:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/Workspace"
        nextCursor:
          type: string
  securitySchemes:
    bearer-jwt:
      bearerFormat: JWT
      description: Access token (ES256). Issued by Posts auth; JWKS at /.well-known/jwks.json.
      name: bearer-jwt
      scheme: bearer
      type: http
