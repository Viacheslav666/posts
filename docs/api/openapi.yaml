          type: string
          example: Иван Иванов
          maxLength: 120
          minLength: 1
        password:
          type: string
          example: correct-horse-battery
          maxLength: 128
          minLength: 10
        timezone:
          type: string
          example: Europe/Moscow
      required:
      - email
      - name
      - password
