components:
  schemas:
    AcceptInvitationRequest:
      type: object
      properties:
        token:
          type: string
      required:
      - token
    ApplyPromoRequest:
      type: object
      properties:
        code:
          type: string
        workspaceId:
          type: string
          format: uuid
      required:
      - code
      - workspaceId
    ApplyPromoResponse:
      type: object
      properties:
        code:
          type: string
        kind:
          type: string
          example: percent
        validUntil:
          type: string
          format: date-time
        value:
          type: number
    AuditLogEntry:
      type: object
      description: Workspace audit log row (US-2.4); retention 1 year
      properties:
        action:
          type: string
          example: member.role_changed
        actorId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        diff:
          type: object
          additionalProperties:
            type: object
          description: JSON diff of changed fields
        entity:
          type: string
          example: workspace_member
        entityId:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        ip:
          type: string
          example: 203.0.113.10
        workspaceId:
          type: string
          format: uuid
    AuditLogPage:
      type: object
      properties:
        hasMore:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogEntry"
        nextCursor:
          type: string
    BulkPostsRequest:
      type: object
      properties:
        action:
          type: string
          enum:
          - pause
          - resume
          - delete
          - reschedule
        postIds:
          type: array
          items:
            type: string
            format: uuid
        scheduledAt:
          type: string
          format: date-time
      required:
      - action
      - postIds
    BulkPostsResponse:
      type: object
      properties:
        affected:
          type: integer
          format: int32
        failedIds:
          type: array
          items:
            type: string
            format: uuid
    CalendarItem:
      type: object
      description: Lightweight calendar cell DTO
      properties:
        channelIds:
          type: array
          items:
            type: string
            format: uuid
        id:
          type: string
          format: uuid
        networks:
          type: array
          items:
            type: string
            description: Social network identifier (DB / publish routing key)
            enum:
            - vk
            - tg
            - ok
            - max
            - rutube
        projectId:
          type: string
          format: uuid
        scheduledAt:
          type: string
          format: date-time
        status:
          type: string
          description: Aggregate post status. `deleted_from_network` = removed from
            social networks via auto-delete/manual delete; soft-deleted drafts use
            `archived`.
          enum:
          - draft
          - pending_approval
          - approved
          - scheduled
          - publishing
          - published
          - partially_published
          - failed
          - paused
          - archived
          - deleted_from_network
        title:
          type: string
    Channel:
      type: object
      properties:
        avatarUrl:
          type: string
        capabilities:
          type: object
          additionalProperties:
            type: object
        createdAt:
          type: string
          format: date-time
        externalId:
          type: string
        id:
          type: string
          format: uuid
        network:
          type: string
          description: Social network identifier (DB / publish routing key)
          enum:
          - vk
          - tg
          - ok
          - max
          - rutube
        projectId:
          type: string
          format: uuid
        status:
          type: string
          description: Channel connection status
          enum:
          - active
          - reauth_required
          - no_permissions
          - disabled
        statusReason:
          type: string
        timezone:
          type: string
        title:
          type: string
          example: Новости бренда
        type:
          type: string
          description: Channel entity type within a network
          enum:
          - group
          - page
          - channel
          - chat
          - profile
        username:
          type: string
        workspaceId:
          type: string
          format: uuid
    ChannelCheckResponse:
      type: object
      properties:
        channelId:
          type: string
          format: uuid
        checkedAt:
          type: string
          format: date-time
        status:
          type: string
          description: Channel connection status
          enum:
          - active
          - reauth_required
          - no_permissions
          - disabled
        statusReason:
          type: string
    ChannelConnectCallbackRequest:
      type: object
      description: OAuth callback (VK/OK) or bot-flow confirm (TG/Max). For OAuth
        provide code+state; for bot flows provide username and/or forwardedMessage/chatId
        (US-3.2/3.4).
      properties:
        chatId:
          type: string
          description: External chat/channel id when known
        code:
          type: string
          description: OAuth authorization code (VK/OK)
        forwardedMessage:
          $ref: "#/components/schemas/ForwardedMessageRef"
          description: Forwarded message reference for bot attach flows
        projectId:
          type: string
          format: uuid
        state:
          type: string
          description: OAuth state (VK/OK)
        username:
          type: string
          description: Telegram/Max channel or chat @username
          example: '@brand_news'
        workspaceId:
          type: string
          format: uuid
      required:
      - workspaceId
    ChannelConnectConfirmRequest:
      type: object
      description: Dedicated bot-flow confirm for Telegram/Max after the bot is added
        as admin
      properties:
        chatId:
          type: string
        forwardedMessage:
          $ref: "#/components/schemas/ForwardedMessageRef"
        projectId:
          type: string
          format: uuid
        username:
          type: string
          example: '@brand_news'
        workspaceId:
          type: string
          format: uuid
      required:
      - workspaceId
    ChannelConnectStartResponse:
      type: object
      properties:
        authorizationUrl:
          type: string
          example: https://oauth.example/...
        botInviteUrl:
          type: string
          description: Bot deep-link for tg/max when applicable
        state:
          type: string
    ChannelPage:
      type: object
      properties:
        hasMore:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/Channel"
        nextCursor:
          type: string
    ChannelSet:
