# Источник правды по правам: docs/product/roles-permissions.yaml
# Не коммитьте карту, рассинхронизированную с OpenAPI (CI упадёт).
version: 1.0.0
updated: '2026-11-17'
task: QA-6
schema: posts.rbac.endpoint-map.v1
description: Карта OpenAPI operationId → RBAC action. Каждый operationId из docs/api/openapi.yaml обязан
  иметь запись. rbac=none — вне матрицы ролей workspace. HTTP-тесты TC-RBAC пропускают эндпоинт при 501
  и включают автоматически, когда ответ не 501. Рассинхрон OpenAPI↔карта ловится тестом.
sources:
  openapi: docs/api/openapi.yaml
  roles_permissions: docs/product/roles-permissions.yaml
test_contract:
  allow_http: не 401/403 (2xx или бизнес-4xx); 501 → skip
  deny_same_workspace_http: 403
  foreign_workspace_http: 404
