  - id: channel_sets.manage
    resource: channel_sets
    description: Создание и изменение наборов каналов
  - id: posts.view
    resource: posts
    description: Просмотр постов
  - id: posts.create
    resource: posts
    description: Создание черновика и вариантов
  - id: posts.update
    resource: posts
    description: Редактирование поста
  - id: posts.delete
