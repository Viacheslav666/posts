  # --- automations / ingest (BE-17) ---
  - action: automations.view
    owner: allow
    admin: allow
    editor: allow
    author: allow
    viewer: allow
    scope: assigned_projects

  - action: automations.manage
    owner: allow
    admin: allow
    editor: allow
    author: deny
    viewer: deny
    scope: assigned_projects

  - action: automations.moderate
    owner: allow
    admin: allow
    editor: allow
    author: deny
    viewer: deny
    scope: assigned_projects


  # --- ORD / ad marking (BE-15) ---
  - action: ord.connection.manage
    owner: allow
    admin: allow
    editor: deny
    author: deny
    viewer: deny
    scope: workspace

  - action: ord.contractors.manage
    owner: allow
    admin: allow
    editor: allow
    author: deny
    viewer: deny
    scope: workspace

  - action: ord.view
    owner: allow
    admin: allow
    editor: allow
    author: allow
    viewer: allow
    scope: assigned_projects

  - action: ord.reports.run
    owner: allow
    admin: allow
    editor: deny
