# Эффекты: allow | deny
# scope:
#   workspace — весь workspace
#   assigned_projects — только ProjectGrant (owner/admin трактуются как все проекты)
#   own_posts — дополнительно created_by = current_user (см. conditions)
# conditions — логические флаги для PermissionEvaluator
matrix:
  # --- workspace ---
  - action: workspace.view
    owner: allow
    admin: allow
    editor: allow
    author: allow
    viewer: allow
    scope: workspace

  - action: workspace.update
    owner: allow
    admin: allow
    editor: deny
    author: deny
    viewer: deny
    scope: workspace

  - action: workspace.delete
    owner: allow
    admin: deny
    editor: deny
    author: deny
    viewer: deny
    scope: workspace

  - action: workspace.transfer_ownership
    owner: allow
    admin: deny
    editor: deny
    author: deny
    viewer: deny
    scope: workspace

  # --- billing ---
  - action: billing.manage
    owner: allow
    admin: deny
    editor: deny
    author: deny
    viewer: deny
    scope: billing

  - action: billing.view
    owner: allow
    admin: deny
    editor: deny
    author: deny
    viewer: deny
    scope: billing

  - action: billing.apply_promo
    owner: allow
    admin: deny
    editor: deny
    author: deny
    viewer: deny
    scope: billing

  # --- members / projects / audit ---
  - action: members.view
    owner: allow
    admin: allow
    editor: allow
    author: allow
    viewer: allow
    scope: workspace

  - action: members.invite
    owner: allow
    admin: allow
    editor: deny
    author: deny
    viewer: deny
    scope: workspace

  - action: members.update
    owner: allow
    admin: allow
    editor: deny
    author: deny
    viewer: deny
    scope: workspace

  - action: members.remove
    owner: allow
    admin: allow
    editor: deny
    author: deny
    viewer: deny
    scope: workspace

  - action: projects.manage
    owner: allow
    admin: allow
    editor: deny
    author: deny
    viewer: deny
    scope: workspace

  - action: projects.view
    owner: allow
    admin: allow
    editor: allow
    author: allow
    viewer: allow
    scope: assigned_projects

  - action: audit.view
    owner: allow
    admin: allow
    editor: deny
    author: deny
    viewer: deny
    scope: workspace

  - action: audit.export
    owner: allow
    admin: allow
    editor: deny
    author: deny
    viewer: deny
    scope: workspace

  # --- channels ---
  - action: channels.view
    owner: allow
    admin: allow
    editor: allow
    author: allow
    viewer: allow
    scope: assigned_projects

  - action: channels.manage
    owner: allow
    admin: allow
    editor: deny
    author: deny
    viewer: deny
    scope: workspace

  - action: channel_sets.view
    owner: allow
    admin: allow
    editor: allow
    author: allow
    viewer: allow
    scope: assigned_projects

  - action: channel_sets.manage
    owner: allow
    admin: allow
    editor: allow
    author: deny
    viewer: deny
    scope: assigned_projects

  # --- posts / media / calendar ---
  - action: posts.view
    owner: allow
    admin: allow
    editor: allow
    author: allow
    viewer: allow
    scope: assigned_projects

  - action: posts.create
    owner: allow
    admin: allow
    editor: allow
    author: allow
    viewer: deny
    scope: assigned_projects

  - action: posts.update
    owner: allow
    admin: allow
    editor: allow
    author: allow
    viewer: deny
    scope: assigned_projects
    conditions:
      author: [own_posts_only]

  - action: posts.delete
    owner: allow
    admin: allow
    editor: allow
    author: allow
    viewer: deny
    scope: assigned_projects
    conditions:
      author: [own_posts_only]

  - action: posts.schedule
    owner: allow
    admin: allow
    editor: allow
    author: deny
    viewer: deny
    scope: assigned_projects

  - action: posts.bulk
    owner: allow
    admin: allow
    editor: allow
    author: deny
    viewer: deny
    scope: assigned_projects

  - action: posts.retry_publish
    owner: allow
    admin: allow
    editor: allow
    author: deny
    viewer: deny
    scope: assigned_projects

  - action: posts.comment
    owner: allow
    admin: allow
    editor: allow
    author: allow
    viewer: allow
    scope: assigned_projects

  - action: media.view
    owner: allow
    admin: allow
    editor: allow
    author: allow
    viewer: allow
    scope: assigned_projects

  - action: media.manage
    owner: allow
    admin: allow
    editor: allow
    author: allow
    viewer: deny
    scope: assigned_projects

  - action: calendar.view
    owner: allow
    admin: allow
    editor: allow
    author: allow
    viewer: allow
    scope: assigned_projects

  - action: calendar.move
    owner: allow
    admin: allow
    editor: allow
    author: deny
    viewer: deny
    scope: assigned_projects

  # --- approvals ---
  - action: approvals.submit
