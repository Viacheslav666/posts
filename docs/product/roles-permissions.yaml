    viewer: deny
    scope: workspace

  - action: posts.ad.schedule
    owner: allow
    admin: allow
    editor: allow
    author: deny
    viewer: deny
    scope: assigned_projects

# Явные инварианты для smoke RBAC (дублируют матрицу — удобны генератору негативных кейсов)
invariants:
  - id: INV-RBAC-001
    description: Только owner управляет биллингом и удаляет workspace
    actions: [billing.manage, billing.view, billing.apply_promo, workspace.delete, workspace.transfer_ownership]
    allowed_roles: [owner]
  - id: INV-RBAC-002
    description: Author не планирует и не публикует
    actions: [posts.schedule, posts.bulk, posts.retry_publish, calendar.move]
    denied_roles: [author, viewer]
  - id: INV-RBAC-003
    description: Viewer не создаёт контент
    actions: [posts.create, posts.update, posts.delete, media.manage]
    denied_roles: [viewer]
  - id: INV-RBAC-004
    description: Каналы подключают только owner и admin
    actions: [channels.manage]
    allowed_roles: [owner, admin]
  - id: INV-RBAC-005
    description: Чужой workspace всегда 404
    rule: foreign_workspace_http_status_404
  - id: INV-RBAC-006
    description: Author не планирует рекламу; Viewer не настраивает ORD
    actions: [posts.ad.schedule, ord.connection.manage, ord.contractors.manage, ord.reports.run]
    denied_roles: [author, viewer]
    notes: Author additionally denied posts.ad.schedule; Viewer denied all ORD configure actions
  - id: INV-RBAC-007
    description: Author/Viewer не управляют граббером и не модерируют очередь
    actions: [automations.manage, automations.moderate]
    denied_roles: [author, viewer]
