# Машиночитаемая RBAC-матрица Posts (MVP)
# Источник правды для PermissionEvaluator (BE-6) и автогенерации TC-RBAC (QA-6).
# Человекочитаемое описание: roles-permissions.md
# Версия матрицы меняется при любом изменении effect/scope/conditions.

version: "1.2.0"
updated: "2026-11-18"
task: "BE-13"
schema: "posts.rbac.v1"

# Platform-admin (E7) is NOT a workspace role. Access is gated by users.platform_admin.
# Workspace RBAC matrix below is unchanged; /api/v1/admin/* is rbac=none in endpoint-map.
platform:
  role_id: platform_admin
  account_flag: users.platform_admin
  description: >
    Внутренняя админ-панель (E7/A13). Отдельный флаг аккаунта, вне матрицы owner/admin/editor/author/viewer.
    Имперсонация: JWT claim imp=true + act=actorUserId; аудит обязателен; запрещены смена пароля и платежи.
  actions:
    - admin.users.search
    - admin.users.get
    - admin.users.impersonate
    - admin.workspaces.search
    - admin.workspaces.get
    - admin.workspaces.adjust_subscription
    - admin.workspaces.adjust_balance
    - admin.plans.manage
    - admin.promos.manage
    - admin.queues.view
    - admin.queues.retry
    - admin.queues.delete
    - admin.feature_flags.manage
    - admin.announcements.manage
    - admin.audit.view

# Ожидаемое поведение генератора тестов:
# - allow + ресурс в scope → HTTP 2xx (или бизнес-код успеха)
# - deny + свой workspace → HTTP 403
# - любой доступ к чужому workspace_id → HTTP 404 (IDOR)
# - conditions оцениваются после role effect=allow
test_contract:
  foreign_workspace_http_status: 404
  denied_same_workspace_http_status: 403
  id_field: action

roles:
  - id: owner
    name: Owner
    description: Владелец workspace; биллинг и удаление.
  - id: admin
    name: Admin
    description: Администрирование участников, каналов и контента без биллинга.
  - id: editor
    name: Editor
    description: Полный контент в назначенных проектах, включая публикацию.
  - id: author
    name: Author
    description: Черновики и отправка на согласование; без самостоятельной публикации.
  - id: viewer
    name: Viewer
    description: Наблюдатель/клиент; чтение и опциональное согласование.

