spring:
  application:
    name: posts-scheduler
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:postgresql://${POSTS_DB_HOST:localhost}:${POSTS_DB_PORT:5432}/${POSTS_DB_NAME:posts}
    username: ${POSTS_DB_USER:posts}
    password: ${POSTS_DB_PASSWORD:posts}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 100
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${POSTS_REDIS_HOST:localhost}
      port: ${POSTS_REDIS_PORT:6379}
  rabbitmq:
    host: ${POSTS_RABBIT_HOST:localhost}
    port: ${POSTS_RABBIT_PORT:5672}
    username: ${POSTS_RABBIT_USER:posts}
    password: ${POSTS_RABBIT_PASSWORD:posts}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

posts:
  scheduler:
    batch-size: 500
    lock-ttl: 10m
    look-ahead: 5s
    confirm-timeout: 5s
    dispatch-interval-ms: 1000
    reaper-interval-ms: 30000
    outbox-relay-interval-ms: 1000
    outbox-relay-batch-size: 200
  billing:
    model: balance
    grace-days: 3
    trial-days: 7
    daily-charge-batch-size: 500
    max-catch-up-days: 14
    low-balance-days-threshold: 3
    autopay-batch-size: 200
    yookassa:
      shop-id: ${POSTS_YOOKASSA_SHOP_ID:test-shop-id-00000000}
      secret-key: ${POSTS_YOOKASSA_SECRET_KEY:test-secret-key-not-a-real-credential}
      base-url: ${POSTS_YOOKASSA_BASE_URL:https://api.yookassa.ru/v3}
      return-url: ${POSTS_YOOKASSA_RETURN_URL:http://localhost:3000/billing/return}

logging:
  level:
    root: INFO
    ru.posts.scheduler: INFO
