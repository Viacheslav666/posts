# Машиночитаемая матрица NetworkCapabilities (AN-2)
# Человекочитаемое описание: docs/product/network-capabilities.md
# Схема: network-capabilities.schema.json
# Правило: status=confirmed только при официальном источнике; иначе status=unknown, value=null.

version: "1.0.0"
updated: "2026-11-17"
task: "AN-2"
schema: "posts.network-capabilities.v1"
checked_at: "2026-11-17"
notes: >
  Бэкенд загружает этот файл в NetworkCapabilities и posts.ratelimit.<network>.*.
  Фронт получает снимок через GET /api/v1/networks/capabilities.
  Числовые лимиты без официальной цифры в документации сети помечены unknown - не подставлять «народные» значения в прод-валидацию без отдельного решения владельца.

