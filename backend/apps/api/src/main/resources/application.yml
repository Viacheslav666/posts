spring:
  application:
    name: posts-api
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 100
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  show-actuator: false
  default-produces-media-type: application/json
  writer-with-order-by-keys: true

posts:
  public-base-url: ${POSTS_PUBLIC_BASE_URL:http://127.0.0.1:8080}
  social-inbound:
    public-base-url: ${POSTS_PUBLIC_BASE_URL:http://127.0.0.1:8080}
    social-base-url: ${POSTS_SOCIAL_BASE_URL:http://127.0.0.1:8090}
    vk-api-version: "5.199"
    recording-handler: false
    retention-days: 14
    partition-ahead-days: 7
    hook-body-max-bytes: 1048576
  # Social Bucket4j/Redis limiter is for publisher (BE-4). API uses in-memory LoginRateLimiter only.
  ratelimit:
    enabled: false
  idempotency:
    ttl: 24h
    in-flight-wait: 5s
    in-flight-poll: 50ms
  s3:
    endpoint: ${POSTS_S3_ENDPOINT:http://127.0.0.1:9000}
    presign-public-base-url: ${POSTS_S3_PRESIGN_PUBLIC_BASE_URL:}
    region: ${POSTS_S3_REGION:us-east-1}
    bucket: ${POSTS_S3_BUCKET:posts-media}
    access-key: ${POSTS_S3_ACCESS_KEY:posts}
    secret-key: ${POSTS_S3_SECRET_KEY:postsposts}
    path-style-access: true
    presign-ttl: 15m
  crypto:
    kek: ${POSTS_DEV_KEK:local-dev-posts-kek}
  notifications:
    telegram-bot-username: ${POSTS_NOTIFY_TG_BOT_USERNAME:posts_notify_bot}
    telegram-webhook-secret: ${POSTS_NOTIFY_TG_WEBHOOK_SECRET:local-notify-tg-secret}
    vapid-public-key: ${POSTS_NOTIFY_VAPID_PUBLIC_KEY:}
    telegram-link-code-ttl-minutes: 15
    unsubscribe-token-ttl-days: 30
  channels:
    social-base-url: ${POSTS_SOCIAL_BASE_URL:http://127.0.0.1:8090}
    social-public-base-url: ${POSTS_SOCIAL_PUBLIC_BASE_URL:}
    app-base-url: ${POSTS_APP_BASE_URL:http://localhost:3000}
    vk-client-id: ${POSTS_CHANNELS_VK_CLIENT_ID:${POSTS_OAUTH_VK_CLIENT_ID:local-vk-channels}}
    vk-client-secret: ${POSTS_CHANNELS_VK_CLIENT_SECRET:local-vk-channels-secret}
    vk-authorization-uri: ${POSTS_CHANNELS_VK_AUTHORIZATION_URI:}
    vk-token-uri: ${POSTS_CHANNELS_VK_TOKEN_URI:}
    vk-api-base-url: ${POSTS_CHANNELS_VK_API_BASE_URL:${POSTS_SOCIAL_VK_BASE_URL:${POSTS_VK_API_BASE_URL:}}}
    vk-redirect-uri: ${POSTS_CHANNELS_VK_REDIRECT_URI:}
    vk-scopes: ${POSTS_CHANNELS_VK_SCOPES:}
    vk-api-version: ${POSTS_CHANNELS_VK_API_VERSION:5.199}
    ok-client-id: ${POSTS_CHANNELS_OK_CLIENT_ID:local-ok-channels}
    ok-client-secret: ${POSTS_CHANNELS_OK_CLIENT_SECRET:local-ok-channels-secret}
    ok-redirect-uri: ${POSTS_CHANNELS_OK_REDIRECT_URI:}
    tg-bot-username: ${POSTS_TG_BOT_USERNAME:posts_local_bot}
    tg-bot-token: ${POSTS_TG_BOT_TOKEN:emulator-token}
    max-bot-token: ${POSTS_MAX_BOT_TOKEN:emulator-max-token}
    ingest-exchange: ingest
    ingest-routing-key: social
  auth:
    hibp-enabled: false
    app-base-url: ${POSTS_APP_BASE_URL:http://localhost:3000}
    mail-from: ${POSTS_MAIL_FROM:Posts <noreply@posts.local>}
    totp-issuer: Posts
    refresh-cookie-name: posts_refresh
    refresh-cookie-secure: false
    refresh-cookie-same-site: Lax
    jwt:
      key-id: posts-es256-1
      issuer: https://posts.ru
      audience: posts-api
      access-token-ttl: 15m
      refresh-token-ttl: 30d
    oauth:
      vk:
        client-id: ${POSTS_OAUTH_VK_CLIENT_ID:local-vk-client}
        client-secret: ${POSTS_OAUTH_VK_CLIENT_SECRET:local-vk-secret}
        authorization-uri: ${POSTS_VK_ID_BASE_URL:https://id.vk.ru}/authorize
        token-uri: ${POSTS_VK_ID_BASE_URL:https://id.vk.ru}/oauth2/auth
        user-info-uri: ${POSTS_VK_ID_BASE_URL:https://id.vk.ru}/oauth2/user_info
        redirect-uri: ${POSTS_OAUTH_VK_REDIRECT_URI:http://localhost:3000/auth/callback/vk}
        scopes: email
      yandex:
        client-id: ${POSTS_OAUTH_YANDEX_CLIENT_ID:local-yandex-client}
        client-secret: ${POSTS_OAUTH_YANDEX_CLIENT_SECRET:local-yandex-secret}
        authorization-uri: ${POSTS_YANDEX_OAUTH_BASE_URL:https://oauth.yandex.ru}/authorize
        token-uri: ${POSTS_YANDEX_OAUTH_BASE_URL:https://oauth.yandex.ru}/token
        user-info-uri: ${POSTS_YANDEX_OAUTH_USER_INFO_URL:${POSTS_YANDEX_OAUTH_BASE_URL:https://oauth.yandex.ru}/info}
        redirect-uri: ${POSTS_OAUTH_YANDEX_REDIRECT_URI:http://localhost:3000/auth/callback/yandex}
        scopes: login:email login:info

  grabber:
    website-enabled: true
    postponed-repost:
      enabled: false
    vk:
      base-url: ${POSTS_VK_API_BASE_URL:https://api.vk.com}
      api-version: "5.199"
    ssrf:
      connect-timeout-ms: 3000
      read-timeout-ms: 10000
      max-bytes: 2097152
      max-redirects: 5

  ord:
    vk:
      base-url: ${POSTS_ORD_VK_BASE_URL:https://api-sandbox.ord.vk.com}
  billing:
    model: balance
    grace-days: 3
    trial-days: 7
    registration-bonus-kopecks: 0
    autopay-default-threshold-kopecks: 10000
    autopay-default-topup-kopecks: 50000
    autopay-min-topup-kopecks: 10000
    daily-charge-batch-size: 500
    low-balance-days-threshold: 3
    yookassa:
      shop-id: ${POSTS_YOOKASSA_SHOP_ID:test-shop-id-00000000}
      secret-key: ${POSTS_YOOKASSA_SECRET_KEY:test-secret-key-not-a-real-credential}
      base-url: ${POSTS_YOOKASSA_BASE_URL:https://api.yookassa.ru/v3}
      return-url: ${POSTS_YOOKASSA_RETURN_URL:http://localhost:3000/billing/return}

logging:
  level:
    root: INFO
