spring:
  application:
    name: posts-media
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:postgresql://${POSTS_DB_HOST:localhost}:${POSTS_DB_PORT:5432}/${POSTS_DB_NAME:posts}
    username: ${POSTS_DB_USER:posts}
    password: ${POSTS_DB_PASSWORD:posts}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${POSTS_REDIS_HOST:localhost}
      port: ${POSTS_REDIS_PORT:6379}
  rabbitmq:
    host: ${POSTS_RABBIT_HOST:localhost}
    port: ${POSTS_RABBIT_PORT:5672}
    username: ${POSTS_RABBIT_USER:posts}
    password: ${POSTS_RABBIT_PASSWORD:posts}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: ${posts.media.prefetch:10}

server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

posts:
  s3:
    endpoint: ${POSTS_S3_ENDPOINT:http://127.0.0.1:9000}
    region: ${POSTS_S3_REGION:us-east-1}
    bucket: ${POSTS_S3_BUCKET:posts-media}
    access-key: ${POSTS_S3_ACCESS_KEY:posts}
    secret-key: ${POSTS_S3_SECRET_KEY:postsposts}
    path-style-access: true
    presign-ttl: 15m
  media:
    prefetch: 10
    clamav:
      enabled: false
    limits:
      image-max-bytes: 20971520
      video-max-bytes: 1073741824
      doc-max-bytes: 104857600
      audio-max-bytes: 104857600
    preview-max-edge: 1280

logging:
  level:
    root: INFO
    ru.posts.media: INFO
